name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/mqtt-get ./cmd/mqtt-get
  sparkplug:
    # Sparkplug B against an independent implementation (pysparkplug) through
    # a real MQTT broker, plus a short fuzz run of the protobuf decoder.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pysparkplug==0.6.1
      - run: SPARKPLUG_INTEROP_PYTHON="$(command -v python)" go test -race -count=1 -v ./test/sparkplug
      - run: go test -run '^$' -fuzz FuzzDecode -fuzztime 30s ./sparkplug
      # Primary host under load: 1,000 edge nodes, every value checked.
      - run: SPARKPLUG_LOAD=1 SPARKPLUG_LOAD_NODES=1000 SPARKPLUG_LOAD_RATE=10000 SPARKPLUG_LOAD_SECONDS=10 go test -count=1 -v -run Load ./test/sparkplug
  tck:
    # The Eclipse Sparkplug TCK's host application tests, with mqtt-get as
    # the primary host application (test/tck). The TCK is downloaded from
    # eclipse.org at run time and runs in an embedded HiveMQ CE broker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: test/tck/broker/pom.xml
      - run: test/tck/run.sh
