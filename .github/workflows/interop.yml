name: interop
# Runs mqtt-get against real brokers (Mosquitto, EMQX, HiveMQ CE, NanoMQ,
# Coreflux) over TCP/WS/TLS/WSS/mTLS. Manual because it pulls ~1.5 GB of images.
on:
  workflow_dispatch:
jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: cd test/interop && ./gen-certs.sh && docker compose up -d
      - run: sleep 30 && docker compose -f test/interop/docker-compose.yml ps
      - run: make interop
      - if: failure()
        run: docker compose -f test/interop/docker-compose.yml logs --tail=100
