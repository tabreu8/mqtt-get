# Mosquitto 2 - one listener per auth method
per_listener_settings true

listener 11883
allow_anonymous true

listener 11884
allow_anonymous false
password_file /certs/mosquitto.passwd

listener 11083
protocol websockets
allow_anonymous true

listener 11893
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key
allow_anonymous true

listener 11894
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key
require_certificate true
use_identity_as_username true

listener 11094
protocol websockets
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key
allow_anonymous true
