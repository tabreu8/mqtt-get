# NanoMQ (emqx/nanomq:*-full image, which includes TLS) - instance a
mqtt { max_packet_size = 10MB, max_mqueue_len = 100000 }
listeners.tcp { bind = "0.0.0.0:41883" }
listeners.ws  { bind = "0.0.0.0:41083/mqtt" }
listeners.ssl { bind = "0.0.0.0:41893", keyfile = "/certs/server.key", certfile = "/certs/server.crt", cacertfile = "/certs/ca.crt", verify_peer = false, fail_if_no_peer_cert = false }
listeners.wss { bind = "0.0.0.0:41094/mqtt" }
http_server { port = 41081, limit_conn = 2, username = admin, password = public, auth_type = basic }
log { to = [console], level = warn }
auth { allow_anonymous = false, no_match = allow, deny_action = ignore password = {include "/certs/pwd.conf"} }
