# NanoMQ (emqx/nanomq:*-full image, which includes TLS) - instance b
mqtt { max_packet_size = 10MB, max_mqueue_len = 100000 }
listeners.tcp { bind = "0.0.0.0:42883" }
listeners.ws  { bind = "0.0.0.0:42083/mqtt" }
listeners.ssl { bind = "0.0.0.0:42894", keyfile = "/certs/server.key", certfile = "/certs/server.crt", cacertfile = "/certs/ca.crt", verify_peer = true, fail_if_no_peer_cert = true }
listeners.wss { bind = "0.0.0.0:42094/mqtt" }
http_server { port = 42081, limit_conn = 2, username = admin, password = public, auth_type = basic }
log { to = [console], level = warn }
auth { allow_anonymous = true, no_match = allow, deny_action = ignore  }
