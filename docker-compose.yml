# Quick start: docker compose up -d, then open http://localhost:8080
# (the admin API key is API_KEYS below; change it).
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]

  mqtt-get:
    build: .
    ports: ["8080:8080"]
    environment:
      MQTT_URL: tcp://mosquitto:1883
      MQTT_TOPICS: "#"
      API_KEYS: change-me-admin-key
    volumes: ["mqtt-get-data:/data"]
    depends_on: [mosquitto]

volumes:
  mqtt-get-data:
